<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ManTrading Apps - Simulator & Backtest</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0f141a;
  color:#e8edf3;
  font:14px Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  overflow:hidden;
}
.container{
  width:min(440px, calc(100vw - 32px));
  background:#181e26;
  border:1px solid #2a3440;
  border-radius:14px;
  padding:30px;
  box-shadow:0 12px 40px rgba(0,0,0,0.6);
  text-align:center;
}
h1{
  margin:0 0 8px;
  font-size:26px;
  letter-spacing:.03em;
  color:#fff;
}
.subtitle{
  color:#8e99a7;
  font-size:13px;
  margin-bottom:24px;
  line-height:1.5;
}
.form-group{
  text-align:left;
  margin-bottom:20px;
}
label{
  display:block;
  color:#9da8b7;
  font-size:12px;
  font-weight:700;
  margin-bottom:8px;
  text-transform:uppercase;
  letter-spacing:.05em;
}
select{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #303a47;
  background:#0d1116;
  color:#fff;
  font-size:14px;
  cursor:pointer;
  outline:none;
}
select:focus{
  border-color:#55d69a;
}
.start-btn{
  width:100%;
  padding:13px;
  border:0;
  border-radius:9px;
  background:#315d48;
  color:#fff;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
  letter-spacing:.04em;
  transition:filter .2s, transform .1s;
}
.start-btn:hover{
  filter:brightness(1.15);
}
.start-btn:active{
  transform:scale(0.98);
}
.footer-note{
  margin-top:20px;
  font-size:11px;
  color:#647488;
  border-top:1px solid #252d37;
  padding-top:16px;
}
</style>
</head>
<body>

<div class="container">
  <h1>ManTrading Apps</h1>
  <div class="subtitle">Simulator Trading, Price Action & Backtest Profesional dengan Manajemen Risiko Otomatis.</div>
  
  <div class="form-group">
    <label for="versionSelect">Pilih Versi Aplikasi</label>
    <select id="versionSelect">
      <option value="ManTradingv2.html" selected>ManTrading v2 (Fitur Lengkap / Chart Interaktif)</option>
      <option value="ManTradingv1.html">ManTrading v1 (Versi Klasik)</option>
    </select>
  </div>

  <button type="button" id="startNowBtn" class="start-btn">▶ START NOW</button>

  <div class="footer-note">
    Pilih versi simulator yang ingin Anda jalankan, lalu klik Start Now.
  </div>
</div>

<script>
"use strict";

const select = document.getElementById("versionSelect");
const startBtn = document.getElementById("startNowBtn");

function launchApp() {
  const targetPage = select.value;
  // Membuka halaman sesuai pilihan dropdown di tab yang sama
  window.location.href = targetPage;
}

// Event klik pada tombol Start Now
startBtn.addEventListener("click", launchApp);

// Bisa juga langsung masuk dengan menekan tombol Enter pada keyboard
select.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    launchApp();
  }
});
</script>

</body>
</html>
