<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eaf2e7">
  <title>Archive — Momona Matsumoto</title>
  <style>
    * { box-sizing: border-box; }
    :root { --ink:#25352b; --muted:#718174; --paper:#fffefa; --green:#dce9d8; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      display: grid; place-items: start center; padding: 30px 18px 40px;
      color: var(--ink); font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(ellipse at 15% 15%, #f8f3d9 0, transparent 34%),
        radial-gradient(ellipse at 85% 80%, #c7ddc3 0, transparent 38%),
        linear-gradient(135deg, #edf3e9, #dce9df 55%, #f5f1e5);
      overflow-x: hidden;
    }
    .glow { position: fixed; width: 260px; height: 260px; border-radius: 50%; background: #fff; filter: blur(80px); opacity: .38; pointer-events: none; }
    .glow.one { top: -100px; right: -50px; }
    .glow.two { bottom: -120px; left: -70px; }
    main { width: min(100%, 520px); position: relative; }

    /* bar atas: brand + About / Archive */
    .pagebar { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin: 0 2px 22px; }
    .brand { font-family: cursive; font-size: clamp(23px, 4vw, 34px); font-style: italic; color: #536653; letter-spacing: -.04em; text-decoration: none; }
    .pagelinks { display: flex; gap: 18px; font: 11px Georgia, serif; color: #73816f; padding-top: 6px; }
    .pagelinks a { color: inherit; text-decoration: none; }
    .pagelinks span { display: inline-block; border-bottom: 1px solid #b8c8b4; padding-bottom: 3px; }
    .pagelinks a:hover span, .pagelinks a.active span { border-bottom-color: #73816f; }
    .pagelinks a.active { color: #455b49; }

    .section { padding: 25px 20px 22px; background: #fffefaad; border: 1px solid #ffffffb8; border-radius: 18px; box-shadow: 0 10px 28px #435b470b; }
    .section-kicker { font: 10px Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #8a9b88; margin: 0 0 8px; }
    h1 { font-size: 29px; font-weight: 500; margin: 0 0 10px; letter-spacing: -.03em; }
    .intro { font: 13px/1.8 Arial, sans-serif; color: #68766a; margin: 0; }

    /* kumpulan polaroid */
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 16px; margin-top: 26px; padding: 0 4px; }
    .shot { position: relative; margin: 0; padding: 8px 8px 28px; background: #fffefa; border: 1px solid #e7e6db; box-shadow: 0 9px 22px #35453625; cursor: zoom-in; transform: rotate(-1.6deg); transition: box-shadow .25s ease, translate .25s ease; }
    .shot:nth-child(even) { transform: rotate(1.8deg); }
    .shot:nth-child(3n) { transform: rotate(-.6deg); }
    .shot:hover, .shot:focus-visible { translate: 0 -5px; box-shadow: 0 16px 32px #35453640; }
    .shot:focus-visible { outline: 2px solid #8fa58b; outline-offset: 3px; }
    .shot::before { content: ""; position: absolute; top: -10px; left: 14%; width: 42px; height: 17px; background: rgba(214,226,206,.82); border: 1px solid rgba(255,255,255,.65); box-shadow: 0 1px 3px #35453620; transform: rotate(-8deg); z-index: 2; }
    .shot:nth-child(even)::before { left: auto; right: 14%; transform: rotate(7deg); }
    .shot img { display: block; width: 100%; aspect-ratio: 4/5; object-fit: contain; background: #f1f0e8; }
    .shot figcaption { position: absolute; left: 10px; right: 10px; bottom: 7px; font: italic 11px Georgia, serif; color: #788275; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .count { font: 10px Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #879583; text-align: center; margin-top: 26px; }

    .backlink { display: block; width: fit-content; margin: 26px auto 0; font: italic 13px Georgia, serif; color: #4e624f; text-decoration: none; border-bottom: 1px solid #879985; padding-bottom: 3px; }
    footer { text-align: center; margin-top: 30px; color: #8b9a89; font: 10px Arial, sans-serif; letter-spacing: .12em; }
    a:focus-visible { outline: 2px solid #8fa58b; outline-offset: 3px; }

    /* lightbox */
    .lightbox { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 18px; background: rgba(37,53,43,.62); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
    .lightbox[hidden] { display: none; }
    .lb-card { position: relative; width: min(100%, 480px); padding: 14px 14px 20px; background: #fffefa; border: 1px solid #fff; box-shadow: 0 28px 80px #25352b66; transform: rotate(-1deg); text-align: center; touch-action: pan-y; }
    .lb-card::before { content: ""; position: absolute; top: -11px; left: 50%; width: 70px; height: 21px; margin-left: -35px; background: rgba(214,226,206,.88); border: 1px solid rgba(255,255,255,.65); box-shadow: 0 1px 3px #35453620; transform: rotate(-3deg); z-index: 2; }
    .lb-img { display: block; width: 100%; height: min(62vh, 560px); height: min(62dvh, 560px); object-fit: contain; background: #f1f0e8; -webkit-user-drag: none; user-select: none; }
    .lb-cap { margin: 14px 0 2px; font: italic 500 20px/1.3 Georgia, serif; color: #455847; letter-spacing: -.01em; }
    .lb-count { margin: 0; font: 10px Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #8a9b88; }
    .lb-btn { display: grid; place-items: center; margin: 0; padding: 0; border: 1px solid #b9cbb8; border-radius: 50%; background: #fffefaf0; color: #455b49; font: 20px/1 Arial, sans-serif; cursor: pointer; z-index: 3; }
    .lb-btn:hover { background: #fff; }
    .lb-close { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; }
    .lb-prev, .lb-next { position: absolute; top: calc(14px + min(31vh, 280px)); width: 40px; height: 40px; margin-top: -20px; box-shadow: 0 4px 12px #25352b30; }
    .lb-prev { left: -8px; } .lb-next { right: -8px; }
    .lb-btn:focus-visible { outline: 2px solid #8fa58b; outline-offset: 2px; }

    @media (max-width: 420px) {
      body { padding: 24px 14px 34px; }
      .section { padding: 22px 14px 20px; }
      .grid { gap: 22px 12px; padding: 0 2px; }
      .shot { padding: 6px 6px 24px; }
      .shot figcaption { font-size: 10px; left: 8px; bottom: 6px; }
    }
    @media (min-width: 700px) {
      main { width: min(100%, 680px); }
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px 20px; }
    }
    @media (min-width: 1024px) { main { width: min(100%, 860px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="glow one"></div><div class="glow two"></div>
  <main>
    <header class="pagebar">
      <a class="brand" href="index.html">Momona Matsumoto</a>
      <nav class="pagelinks" aria-label="Halaman">
        <a href="about.html"><span>About</span></a>
        <a href="gallery.html" class="active" aria-current="page"><span>Archive</span></a>
      </nav>
    </header>

    <section class="section">
      <div class="section-kicker">A small archive of beautiful moments</div>
      <h1>Archive</h1>
      <p class="intro">Semua foto yang disimpan di halaman ini, dikumpulkan di satu tempat. Ketuk foto untuk melihatnya lebih besar.</p>

      <div class="grid" id="grid">
        <figure class="shot"><img src="img/cover.jpg" alt="Potret Momona Matsumoto" loading="lazy"><figcaption>A favorite picture</figcaption></figure>
        <figure class="shot"><img src="img/gallery-5.png" alt="Portrait in natural light" loading="lazy"><figcaption>Soft afternoon light</figcaption></figure>
        <figure class="shot"><img src="img/gallery-4.jpg" alt="Quiet room by a window" loading="lazy"><figcaption>Quiet afternoon</figcaption></figure>
        <figure class="shot"><img src="img/gallery-3.jpg" alt="Misty landscape" loading="lazy"><figcaption>Somewhere peaceful</figcaption></figure>
        <figure class="shot"><img src="img/gallery-1.jpg" alt="Green leaves in soft light" loading="lazy"><figcaption>Green memories</figcaption></figure>
        <figure class="shot"><img src="img/gallery-2.jpg" alt="Ocean waves" loading="lazy"><figcaption>Atlantic coast</figcaption></figure>
        <figure class="shot"><img src="img/gallery-6.jpg" alt="Momen yang akan datang" loading="lazy"><figcaption>More moments to come</figcaption></figure>
      </div>
      <p class="count">7 photographs</p>
      <a class="backlink" href="index.html#gallery">Kembali ke halaman utama</a>
    </section>

    <footer>Made with affection</footer>
  </main>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Foto">
    <div class="lb-card">
      <button type="button" class="lb-btn lb-close" aria-label="Tutup">×</button>
      <button type="button" class="lb-btn lb-prev" aria-label="Foto sebelumnya">‹</button>
      <button type="button" class="lb-btn lb-next" aria-label="Foto berikutnya">›</button>
      <img class="lb-img" src="" alt="" draggable="false">
      <p class="lb-cap"></p>
      <p class="lb-count"></p>
    </div>
  </div>

<script>
(function(){
  var shots=[].slice.call(document.querySelectorAll('.shot'));
  var box=document.getElementById('lightbox');
  if(!shots.length||!box)return;
  var card=box.querySelector('.lb-card'),img=box.querySelector('.lb-img'),cap=box.querySelector('.lb-cap'),count=box.querySelector('.lb-count');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var idx=0,isOpen=false,closing=false,stepping=false,tClose=null;
  /* lepas semua animasi (termasuk yang fill:forwards) supaya buka berikutnya bersih */
  function clear(){[box,card].forEach(function(n){if(n.getAnimations)n.getAnimations().forEach(function(a){a.cancel();});});}

  function fill(i){
    idx=(i+shots.length)%shots.length;
    var im=shots[idx].querySelector('img');
    img.src=im.getAttribute('src');img.alt=im.alt||'';
    cap.textContent=shots[idx].querySelector('figcaption').textContent;
    count.textContent=(idx+1)+' / '+shots.length;
  }
  function from(el){
    var r=el.getBoundingClientRect(),c=card.getBoundingClientRect();
    if(!c.width||r.bottom<0||r.top>innerHeight||r.right<0||r.left>innerWidth)return null;
    return 'translate('+(r.left+r.width/2-c.left-c.width/2)+'px,'+(r.top+r.height/2-c.top-c.height/2)+'px) scale('+(r.width/c.width)+','+(r.height/c.height)+')';
  }
  function d(n){return reduce?0:n;}
  function openLB(i){
    if(isOpen)return;
    isOpen=true;closing=false;stepping=false;clearTimeout(tClose);clear();
    fill(i);box.hidden=false;
    document.documentElement.style.overflow='hidden';
    box.animate([{opacity:0},{opacity:1}],{duration:d(300),easing:'ease'});
    var t=from(shots[idx]);
    card.animate([{transform:(t||'translateY(24px) scale(.92)')+' rotate(0deg)',opacity:t?.5:0},{transform:'rotate(-1deg)',opacity:1}],{duration:d(520),easing:'cubic-bezier(.22,.8,.3,1)'});
    box.querySelector('.lb-close').focus({preventScroll:true});
  }
  function done(){
    if(!isOpen)return;
    clearTimeout(tClose);clear();
    box.hidden=true;isOpen=false;closing=false;stepping=false;
    document.documentElement.style.overflow='';
    shots[idx].focus({preventScroll:true});
  }
  function closeLB(){
    if(!isOpen||closing)return;
    closing=true;
    var t=from(shots[idx]);
    box.animate([{opacity:1},{opacity:0}],{duration:d(280),easing:'ease',fill:'forwards'});
    var a=card.animate([{transform:'rotate(-1deg)',opacity:1},{transform:(t||'translateY(24px) scale(.92)')+' rotate(0deg)',opacity:t?.4:0}],{duration:d(320),easing:'ease',fill:'forwards'});
    a.onfinish=done;
    tClose=setTimeout(done,d(320)+150);
  }
  function step(n){
    if(!isOpen||closing||stepping)return;
    stepping=true;
    var out=n>0?-28:28;
    var a=card.animate([{transform:'rotate(-1deg)',opacity:1},{transform:'translateX('+out+'px) rotate(-1deg)',opacity:0}],{duration:d(160),easing:'ease-in',fill:'forwards'});
    a.onfinish=function(){
      a.cancel();
      if(!isOpen)return;
      fill(idx+n);
      card.animate([{transform:'translateX('+(-out)+'px) rotate(-1deg)',opacity:0},{transform:'rotate(-1deg)',opacity:1}],{duration:d(220),easing:'ease-out'}).onfinish=function(){stepping=false;};
    };
    setTimeout(function(){stepping=false;},d(160)+d(220)+120);
  }

  shots.forEach(function(f,i){
    f.tabIndex=0;f.setAttribute('role','button');
    f.setAttribute('aria-label','Lihat foto: '+f.querySelector('figcaption').textContent);
    f.addEventListener('click',function(){openLB(i);});
    f.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openLB(i);}});
  });
  box.querySelector('.lb-close').addEventListener('click',closeLB);
  box.querySelector('.lb-prev').addEventListener('click',function(){step(-1);});
  box.querySelector('.lb-next').addEventListener('click',function(){step(1);});
  box.addEventListener('click',function(e){if(e.target===box)closeLB();});
  document.addEventListener('keydown',function(e){
    if(!isOpen)return;
    if(e.key==='Escape')closeLB();
    else if(e.key==='ArrowLeft')step(-1);
    else if(e.key==='ArrowRight')step(1);
  });
  /* geser jari kiri/kanan di HP */
  var sx=null;
  card.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});
  card.addEventListener('touchend',function(e){
    if(sx===null)return;
    var dx=e.changedTouches[0].clientX-sx;sx=null;
    if(Math.abs(dx)>50)step(dx<0?1:-1);
  });
})();
</script>
</body>
</html>
