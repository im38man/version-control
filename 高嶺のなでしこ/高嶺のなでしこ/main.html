<script type="text/javascript">
    // ============================================================
    // Data card sekarang diambil dari main.js (variabel cardsData,
    // edit di sana saja)
    // ============================================================
    function renderCard(c){
        return `
        <div class="col-lg-3">
          <div class="card overflow-hidden hover-img">
            <div class="position-relative">
              <label class="badge text-bg-dark rotated-label fw-semibold fs-3 position-absolute bottom-8 end-0 py-1 px-2">${c.label || ""}</label>
              <a href="javascript:void(0)"><img src="${c.thumbnail}" class="card-img-top"></a>
              <span class="badge text-bg-primary fs-3 lh-sm mb-n8 me-8 py-1 px-2 fw-semibold position-absolute bottom-0 end-0">
                <i class="ri-play-fill"></i> ${c.played ? "Played" : ""}</span>
              <img src="${c.profile_image}" class="img-fluid rounded-circle position-absolute bottom-0 start-0 mb-n9 ms-9" width="40" height="40" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="${c.profile_name}">
            </div>
            <div class="card-body p-4">
              <br><b class="d-block my-1 fs-5 text-dark fw-semibold">
                ${c.title}</b>
              <br><a href="${c.youtube_url}"><button class="btn btn-light"><img src="img/yt.png" height="20px"></button></a>
              <div class="d-flex align-items-center gap-4">
                <div class="d-flex align-items-center fs-3 ms-auto"><i class="text-dark">${c.date}</i></div>
              </div>
            </div>
          </div>
        </div>`;
    }

    function getPageList(totalPages, page, maxLength){
        function range(start, end){
            return Array.from(Array(end - start + 1), (_, i) => i + start);
        }

        var sideWidth = maxLength < 9 ? 1 : 2;
        var leftWidth = (maxLength - sideWidth * 2 - 3) >> 1;
        var rightWidth = (maxLength - sideWidth * 2 - 3) >> 1;

        if(totalPages <= maxLength){
            return range(1, totalPages);
        }

        if(page <= maxLength - sideWidth - 1 - rightWidth){
            return range(1, maxLength - sideWidth - 1).concat(0, range(totalPages - sideWidth + 1, totalPages));
        }

        if(page >= totalPages - sideWidth - 1 - rightWidth){
            return range(1, sideWidth).concat(0, range(totalPages - sideWidth - 1 - rightWidth - leftWidth, totalPages));
        }

        return range(1, sideWidth).concat(0, range(page - leftWidth, page + rightWidth), 0, range(totalPages - sideWidth + 1, totalPages));
    }

    $(function(){
        document.getElementById("cardsRow").innerHTML = cardsData.map(renderCard).join("");

        var numberOfItems = cardsData.length;
            var limitPerPage = 16;
            var totalPages = Math.ceil(numberOfItems / limitPerPage);
            var paginationSize = 7;
            var currentPage;

            function showPage(whichPage){
                if(whichPage < 1 || whichPage > totalPages) return false;

                currentPage = whichPage;

                $(".card-content .col-lg-3").hide().slice((currentPage - 1) * limitPerPage, currentPage * limitPerPage).show();

                $(".pagination-main li").slice(1, -1).remove();

                getPageList(totalPages, currentPage, paginationSize).forEach(item => {
                    $("<li>").addClass("page-item").addClass(item ? "current-page" : "dots")
                    .toggleClass("active-page", item === currentPage).append($("<a>").addClass("page-link")
                    .attr({href: "javascript:void(0)"}).text(item || "...")).insertBefore(".next-page");
                });

                $(".previous-page").toggleClass("disable", currentPage === 1);
                $(".next-page").toggleClass("disable", currentPage === totalPages);
                return true;
            }

            $(".paginaion").append(
                $("<li>").addClass("page-item").addClass("previous-page").append($("<a>").addClass("page-link").attr({href: "javascript:void(0)"}).text("Prev")),
                $("<li>").addClass("page-item").addClass("next-page").append($("<a>").addClass("page-link").attr({href: "javascript:void(0)"}).text("Next"))
            );

            $(".card-content").show();
            showPage(1);

            $(document).on("click", ".pagination-main li.current-page:not(.active)", function(){
                return showPage(+$(this).text());
            });

            $(".next-page").on("click", function(){
                return showPage(currentPage + 1);
            });

            $(".previous-page").on("click", function(){
                return showPage(currentPage - 1);
            });
    });
</script>
