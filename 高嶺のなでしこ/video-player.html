<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIDEO - TAKANE NO NADESHIKO</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%23b87b92'><path d='M50,10 C55,30 70,45 90,50 C70,55 55,70 50,90 C45,70 30,55 10,50 C30,45 45,30 50,10 Z'/></svg>" type="image/svg+xml">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* Sembunyikan scrollbar bawaan browser secara total */
        ::-webkit-scrollbar {
            display: none !important;
        }
        * {
            -ms-overflow-style: none !important;  /* IE and Edge */
            scrollbar-width: none !important;  /* Firefox */
        }

        /* CSS Variables */
        :root {
            --bg-color: #0d0d0d;
            --box-bg: #151515;
            --box-bg-hover: #1f1f1f;
            --text-main: #f5f5f5;
            --text-sub: #aaaaaa;
            --accent-pink: #b87b92; 
            --accent-pink-dark: #8c5b6f;
            --accent-pink-transparent: rgba(184, 123, 146, 0.15);
            --border-color: #2a2a2a;
            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-bg-hover: rgba(255, 255, 255, 0.2);
            --font-en: 'Cinzel', serif;
            --font-jp: 'Noto Sans JP', sans-serif;
        }

        /* Reset & Base Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: var(--font-jp); line-height: 1.6;
            -webkit-font-smoothing: antialiased; overflow-x: hidden;
        }
        a { color: inherit; text-decoration: none; transition: opacity 0.3s ease; }
        a:hover { opacity: 0.8; }
        ul { list-style: none; }
        img { max-width: 100%; display: block; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

        /* Header */
        header {
            position: fixed; top: 0; left: 0; width: 100%;
            background-color: rgba(13, 13, 13, 0.95); backdrop-filter: blur(5px);
            z-index: 1000; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px; height: 75px;
        }
        .header-logo { display: flex; align-items: center; gap: 10px; z-index: 1001; }
        .header-logo img { height: 38px; }
        .header-logo-text { display: flex; flex-direction: column; }
        .header-logo-text .en { font-family: var(--font-en); font-size: 1rem; letter-spacing: 2px; line-height: 1.1; }
        .header-logo-text .jp { font-size: 0.55rem; color: var(--text-sub); letter-spacing: 3px; }

        nav ul { display: flex; gap: 20px; }
        nav a { font-family: var(--font-en); font-size: 0.8rem; letter-spacing: 1px; position: relative; }
        nav a.active { color: var(--accent-pink); }
        nav a.active::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 1px; background-color: var(--accent-pink); }

        .header-right { display: flex; align-items: center; gap: 20px; }
        .social-icons { display: flex; gap: 15px; font-size: 1.1rem; padding-right: 15px; border-right: 1px solid var(--border-color); }
        .btn-fanclub {
            background-color: transparent; border: 1px solid var(--border-color); color: var(--text-main);
            padding: 8px 15px; text-align: center; font-family: var(--font-en);
            font-size: 0.75rem; letter-spacing: 1px; border-radius: 3px;
            transition: all 0.3s; display: flex; flex-direction: column; line-height: 1.2; z-index: 1001;
        }
        .btn-fanclub .sub { font-family: var(--font-jp); font-size: 0.55rem; color: var(--accent-pink); }
        .btn-fanclub:hover { border-color: var(--accent-pink); }
        .hamburger { display: none; font-size: 1.5rem; cursor: pointer; z-index: 1001; padding: 5px; }
        .mobile-socials { display: none; }

        /* Main Container */
        .container { max-width: 1500px; margin: 105px auto 40px; padding: 0 30px; }

        /* Breadcrumbs */
        .breadcrumbs { display: flex; align-items: center; gap: 10px; font-size: 0.75rem; color: var(--text-sub); margin-bottom: 20px; font-family: var(--font-en); letter-spacing: 1px; }
        .breadcrumbs i { font-size: 0.7rem; }
        .breadcrumbs span { color: var(--border-color); }

        /* Layout Grid */
        .player-layout { display: grid; grid-template-columns: 1fr 400px; gap: 25px; align-items: start; position: relative; }
        .main-column { display: flex; flex-direction: column; gap: 20px; }

        /* Video Player */
        .video-container { position: relative; width: 100%; height: 100%; background-color: #000; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
        .video-element { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            cursor: pointer; 
        }

        /* Tombol Lock Player di Pojok Kiri Atas (UNLOCK/DEFAULT: Tidak perlu hover, selalu muncul) */
        .player-lock-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 30;
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            opacity: 1;
            visibility: visible;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }

        .player-lock-btn:hover {
            background: rgba(0, 0, 0, 0.8);
            border-color: var(--accent-pink);
            color: var(--accent-pink);
        }
        
        /* Saat terkunci (Locked), tombol lock tetap muncul */
        .player-lock-btn.locked {
            background: var(--accent-pink);
            color: #000;
            border-color: var(--accent-pink);
        }

        /* Saat mode hide-controls (kursor diam / fullscreen tanpa gerakan), tombol unlock ikut sembunyi */
        .video-container.hide-controls .player-lock-btn {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .video-container.is-locked .video-element,
        .video-container.is-locked .custom-controls,
        .video-container.is-locked .progress-bar {
            pointer-events: none !important;
        }
        .video-container.is-locked {
            cursor: not-allowed !important;
        }

        /* Custom Subtitle Overlay */
        #customSubtitleOverlay {
            position: absolute;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 16px;
            font-size: 1.15rem;
            text-align: center;
            border-radius: 4px;
            pointer-events: none;
            display: none;
            z-index: 15;
            font-family: sans-serif;
            text-shadow: 1px 1px 3px #000;
            max-width: 85%;
            line-height: 1.4;
        }

        /* Pas Fullscreen */
        .video-container:fullscreen,
        .video-container:-webkit-full-screen,
        .video-container:-moz-full-screen {
            width: 100vw !important;
            height: 100vh !important;
            background-color: #000;
        }

        .video-container:fullscreen .video-element,
        .video-container:-webkit-full-screen .video-element,
        .video-container:-moz-full-screen .video-element {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important; 
        }

        .custom-controls {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 40px 20px 15px; display: flex; flex-direction: column; gap: 10px; 
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        
        .video-container.hide-controls { cursor: none !important; }
        .video-container.hide-controls .custom-controls {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        /* Styling badge angka 1 pada repeat mirip quality-badge (HD) */
        .repeat-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .repeat-badge {
            font-size: 0.6rem; 
            background: var(--text-main); 
            color: #000; 
            padding: 1px 4px; 
            border-radius: 2px; 
            font-weight: bold; 
            position: absolute; 
            top: -5px; 
            right: -8px;
            font-family: var(--font-jp);
            display: none;
        }
        .repeat-wrapper.repeat-one .repeat-badge {
            display: block;
        }
        .icon-btn.active { color: var(--accent-pink); }

        .progress-bar { width: 100%; height: 5px; background: rgba(255,255,255,0.3); border-radius: 2px; cursor: pointer; position: relative; transition: height 0.2s; }
        .progress-bar:hover { height: 7px; }
        .progress-filled { width: 0%; height: 100%; background: var(--accent-pink); border-radius: 2px; position: relative; pointer-events: none; }
        .progress-handle {
            width: 14px; height: 14px; background: var(--accent-pink); border-radius: 50%;
            position: absolute; right: -7px; top: 50%; transform: translateY(-50%);
            opacity: 0; transition: opacity 0.2s; pointer-events: none;
        }
        .progress-bar:hover .progress-handle { opacity: 1; }
        
        .progress-preview {
            position: absolute;
            bottom: 25px;
            left: 0;
            transform: translateX(-50%);
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--accent-pink);
            border-radius: 6px;
            padding: 4px;
            z-index: 20;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .progress-preview video {
            width: 160px;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: 4px;
            background: #000;
        }
        .progress-preview span {
            font-size: 0.8rem;
            color: #fff;
            margin-top: 5px;
            font-family: sans-serif;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .control-row { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
        .control-left, .control-right { display: flex; align-items: center; gap: 20px; font-size: 1.1rem; }
        .time-display { font-size: 0.8rem; font-family: sans-serif; letter-spacing: 0.5px; margin-left: -5px; }
        .icon-btn { cursor: pointer; transition: color 0.2s; width: 20px; text-align: center; }
        .icon-btn:hover { color: var(--accent-pink); }
        .quality-badge { font-size: 0.6rem; background: var(--text-main); color: #000; padding: 1px 4px; border-radius: 2px; font-weight: bold; position: absolute; top: -5px; right: -8px;}
        .settings-wrap { position: relative; }
        video::-webkit-media-controls { display: none !important; }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .volume-slider {
            width: 0;
            opacity: 0;
            transition: width 0.3s ease, opacity 0.3s ease;
            cursor: pointer;
            -webkit-appearance: none;
            background: linear-gradient(to right, var(--accent-pink) 100%, rgba(255, 255, 255, 0.4) 100%);
            height: 4px;
            border-radius: 2px;
            outline: none;
        }
        .volume-container:hover .volume-slider {
            width: 80px;
            opacity: 1;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: var(--text-main);
            border-radius: 50%;
            transition: transform 0.1s;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: var(--accent-pink);
        }

        .video-info-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 15px; 
            margin-bottom: 12px; 
        }
        .video-title { 
            font-size: 1.4rem; 
            font-weight: 500; 
            line-height: 1.4; 
            flex: 1; 
            min-width: 0; 
        }
        
        .playlist-toggle-drawer {
            display: none;
            align-items: center;
            gap: 6px;
            background: var(--accent-pink);
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .playlist-toggle-drawer:hover {
            background: var(--accent-pink-dark);
        }

        .meta-actions-row { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
        .channel-meta { display: flex; flex-direction: column; gap: 5px; }
        .channel-name { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; font-weight: 500; }
        .verified-icon { color: var(--accent-pink); font-size: 0.8rem; }
        .video-stats { font-size: 0.8rem; color: var(--text-sub); display: flex; gap: 10px; align-items: center; }
        .tags { color: var(--accent-pink); font-size: 0.8rem; }

        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .action-btn { background-color: var(--btn-bg); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; transition: background 0.2s; }
        .action-btn:hover { background-color: var(--btn-bg-hover); }
        .btn-group { display: flex; background-color: var(--btn-bg); border-radius: 20px; overflow: hidden; }
        .btn-group .action-btn { background: transparent; border-radius: 0; }
        .btn-group .action-btn:hover { background-color: rgba(255,255,255,0.1); }
        .divider { width: 1px; background-color: rgba(255,255,255,0.2); margin: 6px 0; }

        .description-box { background-color: var(--box-bg); padding: 15px 20px; border-radius: 8px; font-size: 0.85rem; color: #ddd; position: relative; }
        .desc-content { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; transition: all 0.3s; }
        .desc-content.expanded { -webkit-line-clamp: unset; }
        .desc-content a { color: var(--accent-pink); }
        .show-more-btn { display: block; width: 100%; text-align: center; margin-top: 10px; font-size: 0.8rem; color: var(--text-main); cursor: pointer; background: none; border: none; }
        .show-more-btn i { margin-left: 5px; transition: transform 0.3s; }
        .show-more-btn.active i { transform: rotate(180deg); }

        /* PLAYLIST SIDEBAR & CUSTOM SCROLLBAR */
        .sidebar-column { 
            background-color: var(--box-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            display: flex; 
            flex-direction: column; 
            max-height: calc(100vh - 120px); 
            transition: transform 0.3s ease;
        }
        
        .playlist-scroll-wrapper {
            position: relative;
            flex-grow: 1;
            overflow: hidden;
            display: flex;
        }

        .playlist-items { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 10px 0; 
            width: 100%;
        }

        .custom-scrollbar-track {
            position: absolute;
            right: 4px;
            top: 5px;
            bottom: 5px;
            width: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            z-index: 10;
            cursor: pointer;
        }
        .custom-scrollbar-thumb {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: var(--accent-pink);
            border-radius: 4px;
            opacity: 0.7;
            cursor: pointer;
            transition: opacity 0.2s, background 0.2s;
        }
        .custom-scrollbar-track:hover .custom-scrollbar-thumb,
        .custom-scrollbar-thumb:hover {
            opacity: 1;
            background: var(--accent-pink-dark);
        }

        .playlist-header { 
            padding: 15px 20px; 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .playlist-header h3 { font-family: var(--font-en); font-size: 1rem; letter-spacing: 1px; }
        .playlist-count { font-size: 0.8rem; color: var(--accent-pink); cursor: pointer; display: flex; align-items: center; gap: 5px; }

        .pl-item { display: flex; gap: 12px; padding: 10px 15px; cursor: pointer; transition: background 0.2s; align-items: flex-start; }
        .pl-item:hover { background-color: var(--box-bg-hover); }
        .pl-item.active { background-color: var(--accent-pink-transparent); border-left: 3px solid var(--accent-pink); padding-left: 12px; }
        .pl-index { width: 15px; font-size: 0.8rem; color: var(--text-sub); display: flex; justify-content: center; align-items: center; margin-top: 25px; }
        .pl-item.active .pl-index { color: var(--accent-pink); font-size: 0.6rem; }
        .pl-thumb-wrap { position: relative; width: 120px; flex-shrink: 0; border-radius: 4px; overflow: hidden; }
        .pl-thumb-wrap img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .pl-duration { position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.8); font-size: 0.65rem; padding: 2px 4px; border-radius: 2px; }
        .pl-info { flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-start; }
        .pl-title { font-size: 0.85rem; line-height: 1.3; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .pl-channel { font-size: 0.7rem; color: var(--text-sub); }
        .pl-item.active .pl-title, .pl-item.active .pl-channel { color: var(--text-main); }
        .pl-options { color: var(--text-sub); font-size: 0.9rem; padding: 0 5px; margin-top: 5px; }
        .pl-item.active .pl-options { color: var(--accent-pink); }
        
        .playlist-footer { padding: 15px; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; }
        .btn-full-outline { width: 100%; padding: 12px; text-align: center; border: 1px solid var(--border-color); background: transparent; font-size: 0.85rem; transition: background 0.3s; border-radius: 4px; cursor: pointer; color: var(--text-main); }
        .btn-full-outline:hover { background: var(--box-bg-hover); border-color: var(--accent-pink); }

        /* Drawer Overlay Backdrop */
        .drawer-backdrop {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(3px);
            z-index: 1050; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .drawer-backdrop.active { opacity: 1; visibility: visible; }

        /* Responsive Breakpoints */
        @media (max-width: 1024px) {
            .container { padding: 0 20px; }
            .player-layout { grid-template-columns: 1fr; }
            .playlist-toggle-drawer { display: inline-flex; }
            .hamburger { display: block; }
            nav { 
                position: fixed; top: 75px; left: 0; width: 100%; height: calc(100vh - 75px); 
                background: rgba(13,13,13,0.98); backdrop-filter: blur(15px); 
                flex-direction: column; justify-content: flex-start; align-items: center; 
                padding-top: 40px; z-index: 999; overflow-y: auto;
                opacity: 0; visibility: hidden; transform: translateY(-20px);
                transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            }
            nav.active { opacity: 1; visibility: visible; transform: translateY(0); }
            nav ul { flex-direction: column; gap: 25px; text-align: center; width: 100%; }
            nav a { font-size: 1.1rem; }
            .header-right .social-icons { display: none; }
            .mobile-socials { display: flex; justify-content: center; width: 100%; gap: 20px; margin-top: 40px; font-size: 1.4rem; color: white; }
            .btn-fanclub .sub { display: none; }
            .sidebar-column {
                position: fixed; top: 0; right: -420px; width: 400px; height: 100vh;
                max-height: 100vh; z-index: 1100; border-radius: 0; border-left: 1px solid var(--border-color);
                box-shadow: -5px 0 25px rgba(0,0,0,0.8); transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .sidebar-column.drawer-open { right: 0; }
        }

        @media (max-width: 600px) {
            .container { padding: 0 15px; margin-top: 90px; }
            .custom-controls { padding: 15px 10px 10px; gap: 5px; }
            .control-left, .control-right { gap: 12px; font-size: 0.9rem; }
            .time-display { font-size: 0.7rem; }
            .video-title { font-size: 1.1rem; }
            .meta-actions-row { flex-direction: column; gap: 15px; }
            .action-buttons { width: 100%; overflow-x: auto; padding-bottom: 5px; flex-wrap: nowrap; }
            .pl-thumb-wrap { width: 100px; }
            .pl-title { font-size: 0.8rem; }
            .sidebar-column { width: 100%; right: -100%; }
            .playlist-toggle-drawer { font-size: 0.75rem; padding: 6px 12px; }
            .progress-preview video { width: 100px; }
        }
    </style>
</head>
<body>

    <!-- Backdrop untuk Drawer -->
    <div class="drawer-backdrop" id="drawerBackdrop"></div>

    <!-- Header -->
    <header>
        <a href="#" class="header-logo">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%23b87b92'><path d='M50,10 C55,30 70,45 90,50 C70,55 55,70 50,90 C45,70 30,55 10,50 C30,45 45,30 50,10 Z'/></svg>" alt="Logo Mark">
            <div class="header-logo-text">
                <span class="en">TAKANE NO<br>NADESHIKO</span>
                <span class="jp">高嶺のなでしこ</span>
            </div>
        </a>
        <nav id="mobileNav">
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">NEWS</a></li>
                <li><a href="#">MUSIC</a></li>
                <li><a href="#" class="active">VIDEO</a></li>
                <li><a href="#">MEMBER</a></li>
                <li><a href="#">SCHEDULE</a></li>
                <li><a href="#">GOODS</a></li>
                <li><a href="#">FANCLUB</a></li>
                <li><a href="#">PROFILE</a></li>
            </ul>
            <div class="mobile-socials">
                <a href="#"><i class="fa-brands fa-x-twitter"></i></a>

    <!-- JavaScript Utama -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let currentIndex = 0;
            let visibleCount = 5;
            let isShuffleActive = false;
            let repeatMode = 0; // 0: Off, 1: Infinite, 2: Repeat Once (1)

            const urlParams = new URLSearchParams(window.location.search);
            const titleParam = urlParams.get('title');
            if (titleParam !== null) {
                const foundIndex = playlistData.findIndex(item => item.title === decodeURIComponent(titleParam));
                if (foundIndex !== -1) {
                    currentIndex = foundIndex;
                    if (currentIndex >= visibleCount) {
                        visibleCount = Math.ceil((currentIndex + 1) / 5) * 5;
                    }
                }
            }

            const video = document.getElementById('mainVideo');
            const previewVideo = document.getElementById('previewVideo'); 
            const videoContainerDOM = document.getElementById('videoContainer');
            const mainVideoTitle = document.getElementById('mainVideoTitle');
            const descContent = document.getElementById('descContent');
            const viewCount = document.getElementById('viewCount');
            const publishDate = document.getElementById('publishDate');
            const videoTags = document.getElementById('videoTags');
            const playlistContainer = document.getElementById('playlistContainer');
            const totalPlaylistText = document.getElementById('totalPlaylist');
            const drawerCount = document.getElementById('drawerCount');
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            
            const playPauseBtn = document.getElementById('playPauseBtn');
            const nextBtn = document.getElementById('nextBtn');
            const prevBtn = document.getElementById('prevBtn');
            
            const volumeSlider = document.getElementById('volumeSlider');
            const muteBtn = document.getElementById('muteBtn');
            
            const progressBar = document.getElementById('progressBar');
            const progressFilled = document.getElementById('progressFilled');
            const progressPreview = document.getElementById('progressPreview');
            const previewTime = document.getElementById('previewTime');
            
            const timeDisplay = document.getElementById('timeDisplay');
            const shuffleBtn = document.getElementById('shuffleBtn');
            const repeatBtnContainer = document.getElementById('repeatBtnContainer');
            const pipBtn = document.getElementById('pipBtn'); 
            const ccBtn = document.getElementById('ccBtn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const showMoreBtn = document.getElementById('showMoreBtn');
            const sortBtn = document.getElementById('sortBtn');

            // Tombol Lock Player Elements
            const playerLockBtn = document.getElementById('playerLockBtn');
            const lockIcon = document.getElementById('lockIcon');
            let isPlayerLocked = false;

            playerLockBtn.addEventListener('click', () => {
                isPlayerLocked = !isPlayerLocked;
                if (isPlayerLocked) {
                    videoContainerDOM.classList.add('is-locked');
                    playerLockBtn.classList.add('locked');
                    playerLockBtn.title = "Unlock Player";
                    lockIcon.className = "fa-solid fa-lock";
                } else {
                    videoContainerDOM.classList.remove('is-locked');
                    playerLockBtn.classList.remove('locked');
                    playerLockBtn.title = "Lock Player";
                    lockIcon.className = "fa-solid fa-lock-open";
                }
            });

            shuffleBtn.addEventListener('click', () => {
                if (isPlayerLocked) return;
                isShuffleActive = !isShuffleActive;
                shuffleBtn.classList.toggle('active', isShuffleActive);
            });

            repeatBtnContainer.addEventListener('click', () => {
                if (isPlayerLocked) return;
                repeatMode = (repeatMode + 1) % 3;
                
                if (repeatMode === 0) {
                    repeatBtnContainer.classList.remove('active', 'repeat-one');
                } else if (repeatMode === 1) {
                    repeatBtnContainer.classList.add('active');
                    repeatBtnContainer.classList.remove('repeat-one');
                } else if (repeatMode === 2) {
                    repeatBtnContainer.classList.add('active', 'repeat-one');
                }
            });

            // Custom Subtitle Parser Variables
            let parsedCues = [];
            let isCcEnabled = false;
            const customSubtitleOverlay = document.getElementById('customSubtitleOverlay');

            async function loadSubtitleFile(url) {
                parsedCues = [];
                if (!url) return;

                if (typeof SUBTITLES !== 'undefined' && SUBTITLES[url]) {
                    parseVTT(SUBTITLES[url]);
                    return;
                }

                try {
                    const response = await fetch(encodeURI(url));
                    const text = await response.text();
                    parseVTT(text);
                } catch (e) {
                    console.log("Gagal memuat subtitle:", e);
                }
            }

            function parseVTT(vttText) {
                const lines = vttText.split(/\r?\n/);
                let i = 0;
                while (i < lines.length) {
                    if (lines[i].includes('-->')) {
                        const times = lines[i].split('-->');
                        const start = parseTimeToSeconds(times[0].trim());
                        const end = parseTimeToSeconds(times[1].trim());
                        i++;
                        let textLines = [];
                        while (i < lines.length && lines[i].trim() !== '') {
                            textLines.push(lines[i].replace(/<\/?[^>]+(>|$)/g, ""));
                            i++;
                        }
                        parsedCues.push({ start, end, text: textLines.join('<br>') });
                    } else {
                        i++;
                    }
                }
            }

            function parseTimeToSeconds(timeStr) {
                const parts = timeStr.split(':');
                let seconds = 0;
                if (parts.length === 3) {
                    seconds += parseInt(parts[0]) * 3600;
                    seconds += parseInt(parts[1]) * 60;
                    seconds += parseFloat(parts[2].replace(',', '.'));
                } else if (parts.length === 2) {
                    seconds += parseInt(parts[0]) * 60;
                    seconds += parseFloat(parts[1].replace(',', '.'));
                }
                return seconds;
            }

            // Custom Scrollbar Elements
            const customScrollTrack = document.getElementById('customScrollTrack');
            const customScrollThumb = document.getElementById('customScrollThumb');

            function updateCustomScrollbar() {
                const scrollTop = playlistContainer.scrollTop;
                const scrollHeight = playlistContainer.scrollHeight;
                const clientHeight = playlistContainer.clientHeight;

                if (scrollHeight <= clientHeight) {
                    customScrollTrack.style.display = 'none';
                    return;
                } else {
                    customScrollTrack.style.display = 'block';
                }

                const trackHeight = customScrollTrack.clientHeight;
                const thumbHeight = Math.max((clientHeight / scrollHeight) * trackHeight, 30);
                const maxScrollTop = scrollHeight - clientHeight;
                const maxTrackScroll = trackHeight - thumbHeight;
                const thumbTop = maxScrollTop > 0 ? (scrollTop / maxScrollTop) * maxTrackScroll : 0;

                customScrollThumb.style.height = `${thumbHeight}px`;
                customScrollThumb.style.transform = `translateY(${thumbTop}px)`;
            }

            playlistContainer.addEventListener('scroll', updateCustomScrollbar);
            window.addEventListener('resize', updateCustomScrollbar);

            let isDraggingScroll = false;
            let startY = 0;
            let startScrollTop = 0;

            customScrollThumb.addEventListener('mousedown', (e) => {
                isDraggingScroll = true;
                startY = e.clientY;
                startScrollTop = playlistContainer.scrollTop;
                e.preventDefault();
                e.stopPropagation();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDraggingScroll) return;
                const deltaY = e.clientY - startY;
                const trackHeight = customScrollTrack.clientHeight;
                const thumbHeight = customScrollThumb.clientHeight;
                const scrollHeight = playlistContainer.scrollHeight;
                const clientHeight = playlistContainer.clientHeight;
                
                const maxTrackScroll = trackHeight - thumbHeight;
                if (maxTrackScroll <= 0) return;

                const scrollRatio = deltaY / maxTrackScroll;
                playlistContainer.scrollTop = startScrollTop + scrollRatio * (scrollHeight - clientHeight);
            });

            document.addEventListener('mouseup', () => {
                isDraggingScroll = false;
            });

            customScrollTrack.addEventListener('click', (e) => {
                if (e.target === customScrollThumb) return;
                const rect = customScrollTrack.getBoundingClientRect();
                const clickY = e.clientY - rect.top;
                const trackHeight = customScrollTrack.clientHeight;
                const thumbHeight = customScrollThumb.clientHeight;
                const scrollHeight = playlistContainer.scrollHeight;
                const clientHeight = playlistContainer.clientHeight;
                
                const maxTrackScroll = trackHeight - thumbHeight;
                const targetTrackTop = Math.max(0, Math.min(clickY - thumbHeight / 2, maxTrackScroll));
                const ratio = maxTrackScroll > 0 ? targetTrackTop / maxTrackScroll : 0;
                playlistContainer.scrollTop = ratio * (scrollHeight - clientHeight);
            });

            totalPlaylistText.textContent = playlistData.length;
            drawerCount.textContent = playlistData.length;

            let hideControlsTimeout;

            function showControls() {
                videoContainerDOM.classList.remove('hide-controls');
                clearTimeout(hideControlsTimeout);
                if (!video.paused || document.fullscreenElement) {
                    hideControlsTimeout = setTimeout(() => {
                        videoContainerDOM.classList.add('hide-controls');
                    }, 2500); 
                }
            }

            function hideControls() {
                if (!video.paused) {
                    videoContainerDOM.classList.add('hide-controls');
                }
            }

            videoContainerDOM.addEventListener('mousemove', showControls);
            videoContainerDOM.addEventListener('mouseenter', showControls);
            videoContainerDOM.addEventListener('mouseleave', hideControls);

            function renderPlaylist() {
                playlistContainer.innerHTML = '';
                const itemsToRender = playlistData.slice(0, visibleCount);

                itemsToRender.forEach((data, index) => {
                    const isActive = index === currentIndex;
                    const indexHtml = isActive ? '<i class="fa-solid fa-play"></i>' : index + 1;
                    const rightIconHtml = isActive ? '<i class="fa-solid fa-play"></i>' : '<i class="fa-solid fa-ellipsis-vertical"></i>';

                    const itemHTML = `
                        <div class="pl-item ${isActive ? 'active' : ''}" data-index="${index}">
                            <div class="pl-index">${indexHtml}</div>
                            <div class="pl-thumb-wrap">
                                <img src="${data.thumbnail}" alt="Thumb">
                                <span class="pl-duration">${data.duration}</span>
                            </div>
                            <div class="pl-info">
                                <div class="pl-title">${data.title}</div>
                                <div class="pl-channel">${data.channel}</div>
                            </div>
                            <div class="pl-options">${rightIconHtml}</div>
                        </div>
                    `;
                    playlistContainer.insertAdjacentHTML('beforeend', itemHTML);
                });

                if (visibleCount < playlistData.length) {
                    loadMoreBtn.style.display = 'block';
                    loadMoreBtn.innerHTML = `<i class="fa-solid fa-chevron-down" style="margin-right: 5px;"></i> Tampilkan Lebih Banyak (+5)`;
                } else {
                    loadMoreBtn.style.display = 'none';
                }

                document.querySelectorAll('.pl-item').forEach(item => {
                    item.addEventListener('click', function() {
                        if (isPlayerLocked) return;
                        const idx = parseInt(this.getAttribute('data-index'));
                        if (currentIndex !== idx) {
                            currentIndex = idx;
                            loadVideoData(currentIndex);
                            setTimeout(() => video.play().catch(e => console.log(e)), 100);
                        }
                    });
                });

                setTimeout(updateCustomScrollbar, 50);
            }

            loadMoreBtn.addEventListener('click', () => {
                if (isPlayerLocked) return;
                visibleCount += 5;
                renderPlaylist();
            });

            function loadVideoData(index) {
                const data = playlistData[index];
                
                let source = data.videoSrc;
                if (source && !source.startsWith('http')) {
                    const parts = source.split('/');
                    source = parts.map((part, i) => i === parts.length - 1 ? encodeURIComponent(part) : part).join('/');
                }
                
                video.src = source || "";
                previewVideo.src = source || ""; 
                video.poster = data.thumbnail;

                loadSubtitleFile(data.subtitleSrc);
                customSubtitleOverlay.style.display = 'none';

                mainVideoTitle.textContent = data.title;
                viewCount.textContent = `${data.views} 回視聴`;
                publishDate.textContent = data.date;
                videoTags.innerHTML = data.tags.map(tag => `<a href="#">${tag}</a>`).join(' ');
                descContent.innerHTML = data.description;
                
                descContent.classList.remove('expanded');
                showMoreBtn.classList.remove('active');
                showMoreBtn.innerHTML = 'もっと見る <i class="fa-solid fa-chevron-down"></i>';

                renderPlaylist();
            }

            loadVideoData(currentIndex);

            ccBtn.addEventListener('click', () => {
                if (isPlayerLocked) return;
                isCcEnabled = !isCcEnabled;
                
                if (isCcEnabled) {
                    ccBtn.style.color = 'var(--accent-pink)';
                    ccBtn.classList.remove('fa-regular');
                    ccBtn.classList.add('fa-solid');
                } else {
                    ccBtn.style.color = '';
                    ccBtn.classList.remove('fa-solid');
                    ccBtn.classList.add('fa-regular');
                    customSubtitleOverlay.style.display = 'none';
                }
            });

            function formatTime(seconds) {
                if (isNaN(seconds)) return "0:00";
                const min = Math.floor(seconds / 60);
                const sec = Math.floor(seconds % 60);
                return `${min}:${sec < 10 ? '0' : ''}${sec}`;
            }

            video.addEventListener('loadedmetadata', () => {
                timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
            });

            function togglePlay() {
                if (isPlayerLocked) return;
                if (video.paused) {
                    video.play().catch(e => console.log("Play error:", e));
                } else {
                    video.pause();
                }
            }
            playPauseBtn.addEventListener('click', togglePlay);
            video.addEventListener('click', togglePlay);

            video.addEventListener('play', () => {
                playPauseBtn.classList.remove('fa-play');
                playPauseBtn.classList.add('fa-pause');
                showControls(); 
            });
            
            video.addEventListener('pause', () => {
                playPauseBtn.classList.remove('fa-pause');
                playPauseBtn.classList.add('fa-play');
                videoContainerDOM.classList.remove('hide-controls'); 
                clearTimeout(hideControlsTimeout); 
            });

            video.addEventListener('timeupdate', () => {
                if(video.duration) {
                    const percent = (video.currentTime / video.duration) * 100;
                    progressFilled.style.width = `${percent}%`;
                    timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
                }

                if (isCcEnabled && parsedCues.length > 0) {
                    const currentTime = video.currentTime;
                    const currentCue = parsedCues.find(cue => currentTime >= cue.start && currentTime <= cue.end);
                    
                    if (currentCue) {
                        customSubtitleOverlay.innerHTML = currentCue.text;
                        customSubtitleOverlay.style.display = 'block';
                    } else {
                        customSubtitleOverlay.style.display = 'none';
                    }
                } else {
                    customSubtitleOverlay.style.display = 'none';
                }
            });

            let isDraggingProgress = false;

            function updateProgressFromEvent(e) {
                if (isPlayerLocked) return;
                const rect = progressBar.getBoundingClientRect();
                let clickPosition = (e.clientX - rect.left) / rect.width;
                clickPosition = Math.max(0, Math.min(1, clickPosition));
                video.currentTime = clickPosition * video.duration;
            }

            progressBar.addEventListener('mousedown', (e) => {
                if (isPlayerLocked) return;
                isDraggingProgress = true;
                updateProgressFromEvent(e);
            });

            document.addEventListener('mousemove', (e) => {
                if (isPlayerLocked) return;
                if (isDraggingProgress && video.duration) {
                    updateProgressFromEvent(e);
                    
                    const rect = progressBar.getBoundingClientRect();
                    let clickPosition = (e.clientX - rect.left) / rect.width;
                    clickPosition = Math.max(0, Math.min(1, clickPosition));
                    const hoverTime = clickPosition * video.duration;

                    progressPreview.style.left = `${clickPosition * 100}%`;
                    progressPreview.style.display = 'flex';
                    previewTime.textContent = formatTime(hoverTime);
                    
                    if (previewVideo.readyState >= 1) {
                        previewVideo.currentTime = hoverTime;
                    }
                }
            });

            document.addEventListener('mouseup', () => {
                if (isDraggingProgress) {
                    isDraggingProgress = false;
                    progressPreview.style.display = 'none';
                }
            });

            progressBar.addEventListener('mousemove', (e) => {
                if (isPlayerLocked) return;
                if (!isDraggingProgress && video.duration) {
                    const rect = progressBar.getBoundingClientRect();
                    let clickPosition = (e.clientX - rect.left) / rect.width;
                    clickPosition = Math.max(0, Math.min(1, clickPosition));
                    const hoverTime = clickPosition * video.duration;
                    
                    progressPreview.style.left = `${clickPosition * 100}%`;
                    progressPreview.style.display = 'flex';
                    previewTime.textContent = formatTime(hoverTime);
                    
                    if (previewVideo.readyState >= 1) {
                        previewVideo.currentTime = hoverTime;
                    }
                }
            });

            progressBar.addEventListener('mouseleave', () => {
                if (!isDraggingProgress) progressPreview.style.display = 'none';
            });

            document.addEventListener('keydown', (e) => {
                if (isPlayerLocked) return;
                if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

                if (e.key === 'ArrowRight') {
                    video.currentTime = Math.min(video.duration, video.currentTime + 5);
                    e.preventDefault();
                } else if (e.key === 'ArrowLeft') {
                    video.currentTime = Math.max(0, video.currentTime - 5);
                    e.preventDefault();
                }
            });

            nextBtn.addEventListener('click', () => {
                if (isPlayerLocked) return;
                if (isShuffleActive) {
                    currentIndex = Math.floor(Math.random() * playlistData.length);
                } else {
                    currentIndex = (currentIndex + 1) % playlistData.length;
                }
                loadVideoData(currentIndex);
                setTimeout(() => video.play().catch(e => console.log("Play error:", e)), 100);
            });

            prevBtn.addEventListener('click', () => {
                if (isPlayerLocked) return;
                currentIndex = (currentIndex - 1 + playlistData.length) % playlistData.length;
                loadVideoData(currentIndex);
                setTimeout(() => video.play().catch(e => console.log("Play error:", e)), 100);
            });

            video.addEventListener('ended', () => {
                if (repeatMode === 2) {
                    // Repeat 1 kali: Putar ulang sekali, lalu matikan mode repeat-nya secara otomatis
                    video.currentTime = 0;
                    video.play().catch(e => console.log("Repeat error:", e));
                    
                    repeatMode = 0;
                    repeatBtnContainer.classList.remove('active', 'repeat-one');
                } else if (repeatMode === 1) {
                    // Repeat Infinite: Putar ulang terus menerus
                    video.currentTime = 0;
                    video.play().catch(e => console.log("Repeat error:", e));
                } else if (isShuffleActive) {
                    currentIndex = Math.floor(Math.random() * playlistData.length);
                    loadVideoData(currentIndex);
                    setTimeout(() => video.play().catch(e => console.log(e)), 100);
                } else {
                    currentIndex = (currentIndex + 1) % playlistData.length;
                    loadVideoData(currentIndex);
                    setTimeout(() => video.play().catch(e => console.log(e)), 100);
                }
            });

            function updateVolumeIcon() {
                muteBtn.classList.remove('fa-volume-high', 'fa-volume-low', 'fa-volume-xmark');
                
                if (video.muted || video.volume === 0) {
                    muteBtn.classList.add('fa-volume-xmark');
                    volumeSlider.value = 0;
                } else if (video.volume < 0.5) {
                    muteBtn.classList.add('fa-volume-low');
                    volumeSlider.value = video.volume;
                } else {
                    muteBtn.classList.add('fa-volume-high');
                    volumeSlider.value = video.volume;
                }
                
                const percent = volumeSlider.value * 100;
                volumeSlider.style.background = `linear-gradient(to right, var(--accent-pink) ${percent}%, rgba(255, 255, 255, 0.4) ${percent}%)`;
            }

            volumeSlider.addEventListener('input', (e) => {
                if (isPlayerLocked) return;
                video.volume = e.target.value;
                video.muted = (video.volume === 0);
                updateVolumeIcon();
            });

            muteBtn.addEventListener('click', () => {
                if (isPlayerLocked) return;
                video.muted = !video.muted;
                if(video.muted) {
                    video.volume = 0;
                } else {
                    video.volume = 1; 
                }
                updateVolumeIcon();
            });
            
            updateVolumeIcon();

            pipBtn.addEventListener('click', async () => {
                if (isPlayerLocked) return;
                try {
                    if (document.pictureInPictureElement) {
                        await document.exitPictureInPicture();
                    } else if (document.pictureInPictureEnabled) {
                        await video.requestPictureInPicture();
                    }
                } catch (error) {
                    console.log("PiP error:", error);
                }
            });

            fullscreenBtn.addEventListener('click', () => {
                if (isPlayerLocked) return;
                if (!document.fullscreenElement) {
                    document.getElementById('videoContainer').requestFullscreen().catch(err => {
                        alert(`Gagal fullscreen: ${err.message}`);
                    });
                } else {
                    document.exitFullscreen();
                }
            });

            const hamburger = document.getElementById('hamburger');
            const mobileNav = document.getElementById('mobileNav');
            hamburger.addEventListener('click', () => {
                mobileNav.classList.toggle('active');
                const icon = hamburger.querySelector('i');
                icon.classList.toggle('fa-bars');
                icon.classList.toggle('fa-xmark');
            });

            showMoreBtn.addEventListener('click', () => {
                descContent.classList.toggle('expanded');
                showMoreBtn.classList.toggle('active');
                showMoreBtn.innerHTML = descContent.classList.contains('expanded') 
                    ? '一部を表示 <i class="fa-solid fa-chevron-up"></i>' 
                    : 'もっと見る <i class="fa-solid fa-chevron-down"></i>';
            });

            const sidebarColumn = document.getElementById('sidebarColumn');
            const openDrawerBtn = document.getElementById('openDrawerBtn');
            const closeDrawerBtn = document.getElementById('closeDrawerBtn');
            const drawerBackdrop = document.getElementById('drawerBackdrop');

            function openDrawer() {
                sidebarColumn.classList.add('drawer-open');
                drawerBackdrop.classList.add('active');
            }

            function closeDrawer() {
                sidebarColumn.classList.remove('drawer-open');
                drawerBackdrop.classList.remove('active');
            }

            openDrawerBtn.addEventListener('click', openDrawer);
            closeDrawerBtn.addEventListener('click', closeDrawer);
            drawerBackdrop.addEventListener('click', closeDrawer);

            let isSortedOldest = false;
            sortBtn.addEventListener('click', () => {
                isSortedOldest = !isSortedOldest;
                
                const sortText = sortBtn.querySelector('span');
                const sortIcon = sortBtn.querySelector('i');
                if (isSortedOldest) {
                    sortText.textContent = 'Olders';
                    sortIcon.className = 'fa-solid fa-arrow-up-wide-short';
                } else {
                    sortText.textContent = 'News';
                    sortIcon.className = 'fa-solid fa-arrow-down-short-wide';
                }

                // Ambil data video yang sedang diputar saat ini agar tidak ikut tersesat
                const activeVideo = playlistData[currentIndex];

                playlistData.sort((a, b) => {
                    if (isSortedOldest) {
                        // Terlama ke Terbaru (Ascending)
                        return a.date.localeCompare(b.date);
                    } else {
                        // Terbaru ke Terlama (Descending) -> Diperbaiki dari b.date ke a.date
                        return b.date.localeCompare(a.date);
                    }
                });

                // Sesuaikan kembali posisi currentIndex berdasarkan video yang sedang aktif
                currentIndex = playlistData.indexOf(activeVideo);

                if (currentIndex >= visibleCount) {
                    visibleCount = Math.ceil((currentIndex + 1) / 5) * 5;
                }

                renderPlaylist();
            });
        });
    </script>
</body>
</html>
