<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FANCLUB COMMUNITY - TAKANE NO NADESHIKO</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%23b87b92'><path d='M50,10 C55,30 70,45 90,50 C70,55 55,70 50,90 C45,70 30,55 10,50 C30,45 45,30 50,10 Z'/></svg>" type="image/svg+xml">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* Sembunyikan scrollbar bawaan browser secara total */
        ::-webkit-scrollbar {
            display: none !important;
        }
        * {
            -ms-overflow-style: none !important;  /* IE and Edge */
            scrollbar-width: none !important;  /* Firefox */
        }

        /* CSS Variables */
        :root {
            --bg-color: #0d0d0d;
            --box-bg: #151515;
            --box-bg-hover: #1f1f1f;
            --text-main: #f5f5f5;
            --text-sub: #aaaaaa;
            --accent-pink: #b87b92; 
            --accent-pink-dark: #8c5b6f;
            --accent-pink-transparent: rgba(184, 123, 146, 0.15);
            --border-color: #2a2a2a;
            --font-en: 'Cinzel', serif;
            --font-jp: 'Noto Sans JP', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: var(--font-jp); line-height: 1.6;
            -webkit-font-smoothing: antialiased; overflow-x: hidden;
        }
        a { color: inherit; text-decoration: none; transition: opacity 0.3s ease; }
        a:hover { opacity: 0.8; }
        ul { list-style: none; }
        img { max-width: 100%; display: block; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

        /* Header */
        header {
            position: fixed; top: 0; left: 0; width: 100%;
            background-color: rgba(13, 13, 13, 0.95); backdrop-filter: blur(5px);
            z-index: 1000; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px; height: 75px;
        }
        .header-logo { display: flex; align-items: center; gap: 10px; z-index: 1001; }
        .header-logo img { height: 38px; }
        .header-logo-text { display: flex; flex-direction: column; }
        .header-logo-text .en { font-family: var(--font-en); font-size: 1rem; letter-spacing: 2px; line-height: 1.1; }
        .header-logo-text .jp { font-size: 0.55rem; color: var(--text-sub); letter-spacing: 3px; }

        nav ul { display: flex; gap: 20px; }
        nav a { font-family: var(--font-en); font-size: 0.8rem; letter-spacing: 1px; position: relative; }
        nav a.active { color: var(--accent-pink); }
        nav a.active::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 1px; background-color: var(--accent-pink); }

        .header-right { display: flex; align-items: center; gap: 20px; }
        .social-icons { display: flex; gap: 15px; font-size: 1.1rem; padding-right: 15px; border-right: 1px solid var(--border-color); }
        .btn-fanclub {
            background-color: var(--accent-pink-dark); color: white;
            padding: 8px 15px; text-align: center; font-family: var(--font-en);
            font-size: 0.75rem; letter-spacing: 1px; border-radius: 3px;
            transition: all 0.3s; display: flex; flex-direction: column; line-height: 1.2; z-index: 1001;
        }
        .btn-fanclub .sub { font-family: var(--font-jp); font-size: 0.55rem; color: #fff; }
        .btn-fanclub:hover { background-color: var(--accent-pink); }
        .hamburger { display: none; font-size: 1.5rem; cursor: pointer; z-index: 1001; padding: 5px; }
        .mobile-socials { display: none; }

        /* Container Komunitas */
        .container { max-width: 800px; margin: 105px auto 40px; padding: 0 20px; }

        .community-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        .community-header h1 {
            font-family: var(--font-en);
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: var(--accent-pink);
            margin-bottom: 5px;
        }
        .community-header p {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        /* Kotak Buat Tweet */
        .tweet-box {
            background-color: var(--box-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .tweet-input-area {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            height: 90px;
            outline: none;
            transition: border-color 0.2s;
        }
        .tweet-input-area:focus { border-color: var(--accent-pink); }
        .tweet-box-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }
        .char-count { font-size: 0.75rem; color: var(--text-sub); }
        .btn-post {
            background-color: var(--accent-pink);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .btn-post:hover { background-color: var(--accent-pink-dark); }

        /* Daftar Tweet (Feed) */
        .feed-list { display: flex; flex-direction: column; gap: 20px; }
        .tweet-card {
            background-color: var(--box-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            transition: border-color 0.2s;
        }
        .tweet-card:hover { border-color: rgba(184, 123, 146, 0.4); }
        .tweet-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--accent-pink-dark);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-family: var(--font-en);
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .user-details .name { font-weight: 600; font-size: 0.95rem; }
        .user-details .time { font-size: 0.75rem; color: var(--text-sub); }
        
        .tweet-body {
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        .tweet-actions {
            display: flex;
            gap: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            font-size: 0.85rem;
            color: var(--text-sub);
        }
        .action-item {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .action-item:hover, .action-item.active { color: var(--accent-pink); }

        /* Area Komentar / Balasan */
        .comments-section {
            margin-top: 15px;
            border-top: 1px dashed var(--border-color);
            padding-top: 15px;
            display: none;
        }
        .comments-section.open { display: block; }
        .comment-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }
        .comment-item {
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 0.85rem;
        }
        .comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 0.75rem;
            color: var(--text-sub);
        }
        .comment-author { font-weight: bold; color: var(--text-main); }
        .comment-form {
            display: flex;
            gap: 8px;
        }
        .comment-input {
            flex-grow: 1;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px 10px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }
        .comment-input:focus { border-color: var(--accent-pink); }
        .btn-comment-submit {
            background: var(--accent-pink);
            color: white;
            padding: 0 14px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* Toast Notification */
        #customToast {
            position: fixed; bottom: 30px; right: 30px;
            background: var(--box-bg); border: 1px solid var(--accent-pink);
            color: var(--text-main); padding: 12px 20px; border-radius: 6px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8); z-index: 3000;
            display: flex; align-items: center; gap: 10px; font-size: 0.85rem;
            opacity: 0; visibility: hidden; transform: translateY(20px); transition: all 0.3s ease;
        }
        #customToast.show { opacity: 1; visibility: visible; transform: translateY(0); }
        #customToast i { color: var(--accent-pink); font-size: 1.1rem; }

        @media (max-width: 1024px) {
            .hamburger { display: block; }
            nav { 
                position: fixed; top: 75px; left: 0; width: 100%; height: calc(100vh - 75px); 
                background: rgba(13,13,13,0.98); backdrop-filter: blur(15px); 
                flex-direction: column; justify-content: flex-start; align-items: center; 
                padding-top: 40px; z-index: 999; overflow-y: auto;
                opacity: 0; visibility: hidden; transform: translateY(-20px);
                transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            }
            nav.active { opacity: 1; visibility: visible; transform: translateY(0); }
            nav ul { flex-direction: column; gap: 25px; text-align: center; width: 100%; }
            nav a { font-size: 1.1rem; }
            .header-right .social-icons { display: none; }
            .mobile-socials { display: flex; justify-content: center; width: 100%; gap: 20px; margin-top: 40px; font-size: 1.4rem; color: white; }
            .btn-fanclub .sub { display: none; }
        }
    </style>
</head>
<body>

    <!-- Kustom Toast Notifikasi -->
    <div id="customToast">
        <i class="fa-solid fa-heart"></i>
        <span id="toastMessage">Pesan notifikasi</span>
    </div>

    <!-- Header -->
    <header>
        <a href="index.html" class="header-logo">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%23b87b92'><path d='M50,10 C55,30 70,45 90,50 C70,55 55,70 50,90 C45,70 30,55 10,50 C30,45 45,30 50,10 Z'/></svg>" alt="Logo Mark">
            <div class="header-logo-text">
                <span class="en">TAKANE NO<br>NADESHIKO</span>
                <span class="jp">高嶺のなでしこ</span>
            </div>
        </a>
        <nav id="mobileNav">
            <ul>
                <li><a href="index.html" id="navHome">HOME</a></li>
                <li><a href="#" id="navNews">NEWS</a></li>
                <li><a href="#" id="navMusic">MUSIC</a></li>
                <li><a href="all-video.html" id="navVideo">VIDEO</a></li>
                <li><a href="#" id="navMember">MEMBER</a></li>
                <li><a href="#" id="navSchedule">SCHEDULE</a></li>
                <li><a href="#" id="navGoods">GOODS</a></li>
                <li><a href="fanclub.html" class="active" id="navFanclub">FANCLUB</a></li>
                <li><a href="profile.html" id="navProfile">PROFILE</a></li>
            </ul>
            <div class="mobile-socials">
                <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-youtube"></i></a>
                <a href="#"><i class="fa-brands fa-tiktok"></i></a>
            </div>
        </nav>
        <div class="header-right">
            <div class="social-icons">
                <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-youtube"></i></a>
                <a href="#"><i class="fa-brands fa-tiktok"></i></a>
            </div>
            <a href="fanclub.html" class="btn-fanclub" id="authButton">
                FANCLUB<span class="sub" id="authSubText">会員登録 / ログイン</span>
            </a>
            <div class="hamburger" id="hamburger"><i class="fa-solid fa-bars"></i></div>
        </div>
    </header>

    <main class="container">
        <div class="community-header">
            <h1 id="trTitle">FANCLUB COMMUNITY</h1>
            <p id="trSub">Ruang Saling Sapa & Diskusi Sesama Penggemar Takane no Nadeshiko</p>
        </div>

        <!-- Form Tulis Tweet -->
        <div class="tweet-box">
            <textarea id="tweetInput" class="tweet-input-area" placeholder="Bagikan momen, sapa fans lain, atau tulis dukunganmu di sini..."></textarea>
            <div class="tweet-box-footer">
                <span class="char-count" id="charCount">280</span>
                <button type="button" class="btn-post" id="btnPostTweet">Kirim Postingan</button>
            </div>
        </div>

        <!-- Feed List -->
        <div class="feed-list" id="feedList">
            <!-- Tweet dinamis akan dimasukkan melalui JavaScript -->
        </div>
    </main>

    <!-- JavaScript Komunitas Fanclub -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const authButton = document.getElementById('authButton');
            const authSubText = document.getElementById('authSubText');
            const currentLang = localStorage.getItem('userLang') || 'id';

            // Kamus Terjemahan Halaman Fanclub
            const translations = {
                id: {
                    navHome: "BERANDA", navNews: "BERITA", navMusic: "MUSIK", navVideo: "VIDEO",
                    navMember: "ANGGOTA", navSchedule: "JADWAL", navGoods: "MERCHANDISE", navFanclub: "FANCLUB", navProfile: "PROFIL",
                    authSub: "Daftar / Masuk",
                    title: "KOMUNITAS FANCLUB",
                    sub: "Ruang Saling Sapa & Diskusi Sesama Penggemار Takane no Nadeshiko",
                    placeholder: "Bagikan momen, sapa fans lain, atau tulis dukunganmu di sini...",
                    postBtn: "Kirim Postingan",
                    loginRequired: "Silakan login terlebih dahulu untuk membuat postingan!",
                    commentPlaceholder: "Tulis balasan atau sapaan...",
                    replyBtn: "Balas",
                    toastPosted: "Postingan berhasil dibagikan!",
                    toastLiked: "Menyukai postingan",
                    toastUnliked: "Batal menyukai postingan",
                    toastEmpty: "Postingan tidak boleh kosong!",
                    toastLoginComment: "Silakan login untuk membalas komentar!"
                },
                en: {
                    navHome: "HOME", navNews: "NEWS", navMusic: "MUSIC", navVideo: "VIDEO",
                    navMember: "MEMBER", navSchedule: "SCHEDULE", navGoods: "GOODS", navFanclub: "FANCLUB", navProfile: "PROFILE",
                    authSub: "Register / Login",
                    title: "FANCLUB COMMUNITY",
                    sub: "A space to chat & connect with fellow Takane no Nadeshiko fans",
                    placeholder: "Share a moment, greet other fans, or write your support here...",
                    postBtn: "Post",
                    loginRequired: "Please log in first to create a post!",
                    commentPlaceholder: "Write a reply or greeting...",
                    replyBtn: "Reply",
                    toastPosted: "Post shared successfully!",
                    toastLiked: "Liked post",
                    toastUnliked: "Unliked post",
                    toastEmpty: "Post cannot be empty!",
                    toastLoginComment: "Please log in to reply to comments!"
                },
                jp: {
                    navHome: "HOME", navNews: "NEWS", navMusic: "MUSIC", navVideo: "VIDEO",
                    navMember: "MEMBER", navSchedule: "SCHEDULE", navGoods: "GOODS", navFanclub: "FANCLUB", navProfile: "PROFILE",
                    authSub: "会員登録 / ログイン",
                    title: "ファンクラブコミュニティ",
                    sub: "高嶺のなでしこのファンの皆様のための交流・おしゃべり広場",
                    placeholder: "今の気持ちやファン同士のあいさつをシェアしよう...",
                    postBtn: "投稿する",
                    loginRequired: "投稿するには先にログインしてください！",
                    commentPlaceholder: "返信やあいさつを入力...",
                    replyBtn: "返信",
                    toastPosted: "投稿がシェアされました！",
                    toastLiked: "いいねしました",
                    toastUnliked: "いいねを取り消しました",
                    toastEmpty: "投稿内容が空です！",
                    toastLoginComment: "コメントするにはログインしてください！"
                }
            };

            const t = translations[currentLang] || translations.id;

            // Terapkan Terjemahan Navigasi & Header
            document.getElementById('navHome').textContent = t.navHome;
            document.getElementById('navNews').textContent = t.navNews;
            document.getElementById('navMusic').textContent = t.navMusic;
            document.getElementById('navVideo').textContent = t.navVideo;
            document.getElementById('navMember').textContent = t.navMember;
            document.getElementById('navSchedule').textContent = t.navSchedule;
            document.getElementById('navGoods').textContent = t.navGoods;
            document.getElementById('navFanclub').textContent = t.navFanclub;
            document.getElementById('navProfile').textContent = t.navProfile;
            document.getElementById('trTitle').textContent = t.title;
            document.getElementById('trSub').textContent = t.sub;
            document.getElementById('tweetInput').placeholder = t.placeholder;
            document.getElementById('btnPostTweet').textContent = t.postBtn;

            if (isLoggedIn) {
                authButton.href = 'profile.html';
                authSubText.textContent = currentLang === 'jp' ? 'マイページ' : (currentLang === 'en' ? 'My Page' : 'Halaman Saya');
            } else {
                authButton.href = 'login.html';
                authSubText.textContent = t.authSub;
            }

            const customToast = document.getElementById('customToast');
            const toastMessage = document.getElementById('toastMessage');
            let toastTimer;
            function showToast(message) {
                toastMessage.textContent = message;
                customToast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => customToast.classList.remove('show'), 3000);
            }

            const tweetInput = document.getElementById('tweetInput');
            const charCount = document.getElementById('charCount');
            const btnPostTweet = document.getElementById('btnPostTweet');
            const feedList = document.getElementById('feedList');

            tweetInput.addEventListener('input', () => {
                const remaining = 280 - tweetInput.value.length;
                charCount.textContent = remaining;
                if (remaining < 0) charCount.style.color = '#ff4444';
                else charCount.style.color = 'var(--text-sub)';
            });

            // Data Default Tweet Komunitas Jika Kosong
            let tweets = JSON.parse(localStorage.getItem('fanclubTweets')) || [
                {
                    id: 1,
                    author: "OshiNoMomo",
                    avatar: "O",
                    time: "2 jam yang lalu",
                    content: "Halo semuanya! Ada yang mau ikutan nonton event TakaneKO minggu depan? Salken ya buat fans baru! ❤️",
                    likes: 14,
                    liked: false,
                    comments: [
                        { author: "NadeshikoLover", time: "1 jam lalu", text: "Halo! Wah seru banget tuh, salam kenal juga ya!" }
                    ]
                },
                {
                    id: 2,
                    author: "TakaneStaff_Fan",
                    avatar: "T",
                    time: "5 jam yang lalu",
                    content: "Lagu baru mereka benar-benar candu banget diputar tiap pagi. Semangat terus buat semua member! 🎵✨",
                    likes: 28,
                    liked: true,
                    comments: []
                }
            ];

            function saveTweets() {
                localStorage.setItem('fanclubTweets', JSON.stringify(tweets));
            }

            function renderTweets() {
                feedList.innerHTML = '';
                if (tweets.length === 0) {
                    feedList.innerHTML = `<div style="text-align: center; color: var(--text-sub); padding: 30px;">Belum ada postingan. Jadilah yang pertama menyapa!</div>`;
                    return;
                }

                tweets.forEach((tweet) => {
                    const commentsHtml = tweet.comments.map(c => `
                        <div class="comment-item">
                            <div class="comment-header">
                                <span class="comment-author"><i class="fa-solid fa-user-circle" style="color:var(--accent-pink); margin-right:4px;"></i> ${c.author}</span>
                                <span>${c.time}</span>
                            </div>
                            <div>${c.text}</div>
                        </div>
                    `).join('');

                    const card = document.createElement('div');
                    card.className = 'tweet-card';
                    card.innerHTML = `
                        <div class="tweet-user-info">
                            <div class="user-avatar">${tweet.avatar}</div>
                            <div class="user-details">
                                <div class="name">${tweet.author}</div>
                                <div class="time">${tweet.time}</div>
                            </div>
                        </div>
                        <div class="tweet-body">${escapeHtml(tweet.content)}</div>
                        <div class="tweet-actions">
                            <div class="action-item ${tweet.liked ? 'active' : ''}" onclick="toggleLike(${tweet.id})">
                                <i class="${tweet.liked ? 'fa-solid fa-heart' : 'fa-regular fa-heart'}"></i> <span>${tweet.likes}</span>
                            </div>
                            <div class="action-item" onclick="toggleCommentBox(${tweet.id})">
                                <i class="fa-regular fa-comment"></i> <span>${tweet.comments.length} Balasan</span>
                            </div>
                        </div>
                        <div class="comments-section" id="commentSection-${tweet.id}">
                            <div class="comment-list">
                                ${commentsHtml || '<div style="font-size:0.8rem; color:var(--text-sub); font-style:italic;">Belum ada balasan.</div>'}
                            </div>
                            <div class="comment-form">
                                <input type="text" class="comment-input" id="commentInput-${tweet.id}" placeholder="${t.commentPlaceholder}">
                                <button type="button" class="btn-comment-submit" onclick="addComment(${tweet.id})">${t.replyBtn}</button>
                            </div>
                        </div>
                    `;
                    feedList.appendChild(card);
                });
            }

            function escapeHtml(text) {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return text.replace(/[&<>"']/g, function(m) { return map[m]; });
            }

            btnPostTweet.addEventListener('click', () => {
                if (!isLoggedIn) {
                    showToast(t.loginRequired);
                    setTimeout(() => window.location.href = 'login.html', 1500);
                    return;
                }

                const content = tweetInput.value.trim();
                if (!content) {
                    showToast(t.toastEmpty);
                    return;
                }

                if (content.length > 280) {
                    showToast("Postingan terlalu panjang (maksimal 280 karakter)!");
                    return;
                }

                const userName = localStorage.getItem('userName') || "TakaneFan";
                const newTweet = {
                    id: Date.now(),
                    author: userName,
                    avatar: userName.charAt(0).toUpperCase(),
                    time: "Baru saja",
                    content: content,
                    likes: 0,
                    liked: false,
                    comments: []
                };

                tweets.unshift(newTweet);
                saveTweets();
                renderTweets();
                tweetInput.value = '';
                charCount.textContent = '280';
                showToast(t.toastPosted);
            });

            window.toggleLike = function(id) {
                const tweet = tweets.find(t => t.id === id);
                if (tweet) {
                    if (tweet.liked) {
                        tweet.likes -= 1;
                        tweet.liked = false;
                        showToast(t.toastUnliked);
                    } else {
                        tweet.likes += 1;
                        tweet.liked = true;
                        showToast(t.toastLiked);
                    }
                    saveTweets();
                    renderTweets();
                }
            };

            window.toggleCommentBox = function(id) {
                const section = document.getElementById(`commentSection-${id}`);
                section.classList.toggle('open');
            };

            window.addComment = function(id) {
                if (!isLoggedIn) {
                    showToast(t.toastLoginComment);
                    setTimeout(() => window.location.href = 'login.html', 1500);
                    return;
                }

                const input = document.getElementById(`commentInput-${id}`);
                const text = input.value.trim();
                if (!text) return;

                const tweet = tweets.find(t => t.id === id);
                if (tweet) {
                    const userName = localStorage.getItem('userName') || "TakaneFan";
                    tweet.comments.push({
                        author: userName,
                        time: "Baru saja",
                        text: text
                    });
                    saveTweets();
                    renderTweets();
                    const section = document.getElementById(`commentSection-${id}`);
                    section.classList.add('open');
                }
            };

            const hamburger = document.getElementById('hamburger');
            const mobileNav = document.getElementById('mobileNav');
            hamburger.addEventListener('click', () => {
                mobileNav.classList.toggle('active');
                const icon = hamburger.querySelector('i');
                icon.classList.toggle('fa-bars');
                icon.classList.toggle('fa-xmark');
            });

            renderTweets();
        });
    </script>
</body>
</html>
